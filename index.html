<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>บันทึกการใช้เครื่องปั่นไฟ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{--bg:#f1f4f8;--card:#fff;--tx:#16212c;--mu:#52606d;--bd:#e0e5eb;--ac:#0b7285;--on:#fff;--sf:#eaf0f5;--sh:0 1.5px 7px rgba(20,35,55,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151a;--card:#1a2129;--tx:#eef2f6;--mu:#a5b0bc;--bd:#2b343e;--sf:#232c35;--sh:none}}
:root[data-theme="dark"]{--bg:#10151a;--card:#1a2129;--tx:#eef2f6;--mu:#a5b0bc;--bd:#2b343e;--sf:#232c35;--sh:none}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:11.9px/1.5 system-ui,"Noto Sans Thai","Sarabun",sans-serif}
.wrap{max-width:532px;margin:0 auto;padding:9.8px 9.8px 77px}
.head{display:flex;justify-content:space-between;align-items:center;gap:7px;margin-bottom:8.4px}
h1{font-size:15.4px;margin:0;line-height:1.25}.sub{color:var(--mu);font-size:9.8px;margin:1.5px 0 0}
.gear{flex:none;width:33.6px;height:33.6px;border-radius:9.8px;border:1px solid var(--bd);background:var(--card);font-size:15.4px;box-shadow:var(--sh)}
.tabs{display:flex;gap:5.6px;overflow-x:auto;padding:1.5px 1.5px 7px;scrollbar-width:none}
.tab{flex:none;display:flex;align-items:center;gap:5.6px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:699.3px;padding:6.3px 11.2px;font:inherit;font-size:11.2px;font-weight:600;box-shadow:var(--sh)}
.tab i{width:8.4px;height:8.4px;border-radius:50%;background:var(--c)}
.tab.on{background:var(--c);border-color:var(--c);color:#fff}.tab.on i{background:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:2.8px 0 8.4px}
.stat{background:var(--card);border-radius:11.2px;padding:9.1px 9.8px;box-shadow:var(--sh);border:1px solid var(--bd)}
.stat b{display:block;font-size:16.8px;line-height:1.2}.stat span{color:var(--mu);font-size:9.8px}
.stat em{font-style:normal;font-size:14px;display:block;margin-bottom:1.5px}
.hint{background:var(--sf);border-left:3.5px solid var(--ac);border-radius:8.4px;padding:7px 9.8px;font-size:10.5px;margin-bottom:8.4px}
.bar{display:flex;gap:7px;margin-bottom:8.4px}
input,select,textarea{width:100%;font:inherit;font-size:11.9px;color:var(--tx);background:var(--card);border:1.5px solid var(--bd);border-radius:9.8px;padding:8.4px 9.8px;min-height:35px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac)}
.btn{border:1.5px solid var(--bd);border-radius:9.8px;padding:8.4px 11.2px;font:inherit;font-weight:600;background:var(--card);color:var(--tx);min-height:35px;white-space:nowrap}
.card{background:var(--card);border-radius:11.2px;border-left:4.9px solid var(--c);padding:9.1px 10.5px;margin-bottom:7px;box-shadow:var(--sh);border-top:1px solid var(--bd);border-right:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.card .t{display:flex;justify-content:space-between;align-items:flex-start;gap:7px}
.ttl{font-size:12.6px;font-weight:700;line-height:1.3}.lc{margin-right:4.2px}
.dt{color:var(--mu);font-size:10.5px;white-space:nowrap}
.card .m{font-size:11.2px;margin-top:3.5px}.card .s{color:var(--mu);font-size:10.5px;margin-top:2.8px}textarea{resize:vertical;line-height:1.5;display:block}.card .s{white-space:pre-wrap}
.tag{display:inline-block;font-size:9.8px;font-weight:700;border-radius:5.6px;padding:1.5px 7px;background:var(--c);color:#fff;margin-bottom:4.2px}
.empty{text-align:center;color:var(--mu);padding:25.2px 5.6px;font-size:12.6px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(11.2px + env(safe-area-inset-bottom,0px));background:var(--ac);color:var(--on);border:0;border-radius:699.3px;padding:11.2px 22.4px;font:inherit;font-weight:700;font-size:13.3px;box-shadow:0 5.6px 15.4px rgba(0,0,0,.28);white-space:nowrap}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
.ov.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:532px;max-height:94%;overflow:auto;border-radius:16.8px 16.8px 0 0;border-top:5.6px solid var(--ac);padding:11.2px 11.2px calc(14px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 4.2px;font-size:14.7px}
label{display:block;font-size:10.5px;font-weight:600;margin:8.4px 0 3.5px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.calc{background:var(--sf);border-radius:9.8px;padding:8.4px 9.8px;margin-top:8.4px;font-size:11.2px;font-weight:600}
.chk{display:flex;gap:8.4px;align-items:center;margin:8.4px 0 1.5px;font-size:11.9px;font-weight:600;background:var(--card);border:1.5px solid var(--bd);border-radius:9.8px;padding:8.4px 9.8px}
.chk input{width:16.8px;height:16.8px;min-height:0;accent-color:var(--ac)}
.act{display:flex;gap:7px;margin-top:12.6px}.act .btn{flex:1}.pri{background:var(--ac);color:var(--on);border-color:var(--ac);flex:2!important;font-size:12.6px}
.toast{position:fixed;top:calc(9.8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#1d2b36;color:#fff;border-radius:8.4px;padding:7.7px 14px;font-size:11.2px;z-index:9;display:none}
.seg{display:flex;gap:5.6px;margin-bottom:8.4px}
.seg button{flex:1;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:9.8px;padding:7.7px 5.6px;font:inherit;font-size:11.2px;font-weight:700;box-shadow:var(--sh)}
.seg button.on{background:var(--ac);border-color:var(--ac);color:var(--on)}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:8.4px 0}
.chip{text-align:left;border:1.5px solid var(--c);border-left-width:4.9px;background:var(--card);color:var(--tx);border-radius:9.8px;padding:7px 8.4px;font:inherit}
.chip b{display:block;font-size:11.9px}.chip span{font-size:9.8px;color:var(--mu)}
.chip.done{background:var(--c)}.chip.done b,.chip.done span{color:#fff}
.bad{color:#e03131;font-weight:600}
#ck_items .chk{margin:4.2px 0 0}
.today{font-size:13px;font-weight:600;color:var(--ac);margin-top:2px}#fbar>*{flex:1}#fbar #fmode{flex:0 0 38%}
.ibtn{flex:none;width:38px;height:38px;display:grid;place-items:center;border:0;border-radius:12px;background:var(--ac);color:var(--on);box-shadow:var(--sh);padding:0}.ibtn:active{transform:scale(.95)}

/* ===== Desktop / Tablet ===== */
@media (min-width:768px){
body{font-size:14.5px}
.wrap{max-width:1040px;padding:26px 28px 110px}
.head{margin-bottom:16px}
h1{font-size:25px}.sub{font-size:13px;margin-top:3px}.today{font-size:16px}
.gear,.ibtn{width:46px;height:46px;border-radius:13px}.ibtn svg{width:26px;height:26px}
.seg{gap:10px;margin-bottom:14px;max-width:560px}.seg button{font-size:15px;padding:12px 10px;border-radius:12px}
.tabs{gap:9px;padding:3px 3px 12px}.tab{font-size:14.5px;padding:9px 20px;gap:8px}.tab i{width:10px;height:10px}
.bar{gap:12px;margin-bottom:14px}
#fbar>*{flex:0 1 230px}#fbar #fmode{flex:0 0 200px}
#fcap{font-size:13px!important;margin:-4px 2px 12px!important}
input,select,textarea{font-size:14.5px;padding:10px 14px;min-height:44px;border-radius:11px}
.btn{font-size:14.5px;padding:10px 20px;min-height:44px;border-radius:11px;cursor:pointer}
.btn:hover,.tab:hover,.seg button:hover,.chip:hover,.gear:hover{filter:brightness(.97)}
.tab,.seg button,.chip,.fab,.ibtn,.gear{cursor:pointer}
#q{flex:1}#xl{flex:0 0 auto}
.grid{grid-template-columns:repeat(4,1fr);gap:14px;margin:4px 0 16px}
.stat{padding:16px 18px;border-radius:14px}.stat em{font-size:22px;margin-bottom:4px}.stat b{font-size:24px}.stat span{font-size:13px}
.hint{font-size:14px;padding:12px 16px;margin-bottom:16px;border-radius:11px;line-height:1.7}
.chips{grid-template-columns:repeat(4,1fr);gap:12px;margin:12px 0 16px}
.chip{padding:12px 14px;border-radius:12px}.chip b{font-size:15px}.chip span{font-size:12.5px;line-height:1.6}
#list{display:flex;flex-direction:column;gap:10px}
#list .empty{grid-column:1/-1;font-size:15px;padding:50px 10px}
.card{margin-bottom:0;padding:14px 16px;border-radius:14px;cursor:pointer;transition:transform .12s,box-shadow .12s}
.card:hover{background:#fafcff;box-shadow:0 4px 14px rgba(20,35,55,.12)}
#list .card{display:grid;grid-template-columns:118px 1fr;column-gap:16px;align-items:start;padding:12px 18px}
#list .card>.tag{grid-column:1;grid-row:1/span 8;justify-self:start;margin:2px 0 0}
#list .card>:not(.tag){grid-column:2}
#list .card .t{align-items:baseline;gap:16px}
#list .card .m:first-of-type{margin-top:0}
.tag{font-size:12px;padding:2px 10px;margin-bottom:7px}
.ttl{font-size:15.5px}.dt{font-size:13px}.card .m{font-size:13.5px;margin-top:5px}.card .s{font-size:12.5px;margin-top:4px}
.fab{font-size:16px;padding:15px 34px;bottom:calc(24px + env(safe-area-inset-bottom,0px));transition:transform .12s}
.fab:hover{transform:translateX(-50%) translateY(-2px)}
.ov{align-items:center;padding:24px}
.sheet{max-width:620px;max-height:92vh;border-radius:18px;border-top-width:6px;padding:22px 26px 24px}
.sheet h2{font-size:21px;margin-bottom:8px}
label{font-size:13px;margin:12px 0 5px}
.r2{gap:14px}
.calc{font-size:14px;padding:11px 14px;margin-top:12px;border-radius:11px}
.chk{font-size:14.5px;padding:11px 14px;margin-top:12px;border-radius:11px}.chk input{width:20px;height:20px}
#ck_items{display:grid;grid-template-columns:1fr 1fr;gap:8px}#ck_items .chk{margin:0}
.act{gap:12px;margin-top:20px}.pri{font-size:15.5px}
.toast{font-size:14.5px;padding:10px 20px;border-radius:10px}
}
@media (min-width:1200px){
.wrap{max-width:1160px}
}

/* ===== จัดระเบียบข้อมูลในรายการ ===== */
.flds{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px 10px;margin-top:8px}
.fl{background:var(--sf);border-radius:8px;padding:5px 8px;min-width:0}
.fl span{display:block;font-size:9.5px;color:var(--mu);line-height:1.3}
.fl b{display:block;font-size:11.5px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.fl small{font-weight:400;color:var(--mu);font-size:9.5px}
.nt{margin-top:7px;padding:5px 9px;border-left:3px solid var(--c);background:var(--sf);border-radius:0 8px 8px 0;font-size:10.5px;color:var(--mu);white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere}
.nt.bad{color:#e03131;border-left-color:#e03131;background:rgba(224,49,49,.08)}
.pill{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}
.pill.ok{background:#d3f9d8;color:#2b8a3e}.pill.warn{background:#fff3bf;color:#b45309}
@media (min-width:768px){
.flds{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 12px;margin-top:10px}
.fl{padding:7px 11px;border-radius:10px}.fl span{font-size:12px}.fl b{font-size:14px}.fl small{font-size:12px}
.nt{font-size:13px;padding:7px 12px;margin-top:9px}.pill{font-size:12px;padding:2px 10px}
#list .card>.tag{grid-row:1/span 4}
}


/* ===== รายการแบบแถว ===== */
.row{display:grid;grid-template-columns:54px 1fr auto;gap:6px 14px;align-items:center;background:var(--card);border-radius:14px;border-left:5px solid var(--c);box-shadow:var(--sh);padding:11px 14px;margin-bottom:9px;cursor:pointer;transition:background .12s,box-shadow .12s}
.row:hover{background:var(--sf)}
.rd{text-align:center;line-height:1.15;background:var(--sf);border-radius:11px;padding:6px 2px}
.row:hover .rd{background:var(--card)}
.rd b{display:block;font-size:20px;color:var(--c)}.rd span{font-size:10px;color:var(--mu);white-space:nowrap}
.rm{min-width:0}
.rt{font-size:12.6px;font-weight:700;line-height:1.45;overflow-wrap:anywhere}.rt em{font-weight:500;color:var(--c);font-style:normal}
.rt .ap{display:inline-block;background:var(--c);color:#fff;font-size:10px;font-weight:700;padding:1px 9px;border-radius:99px;margin-right:7px;vertical-align:1px}
.rs{font-size:10.8px;color:var(--mu);margin-top:3px;line-height:1.6}
.dot{font-style:normal;margin:0 7px;opacity:.5}
.rn{font-size:10.5px;color:var(--mu);margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rn.bad{color:#e03131;font-weight:600}
.rv{text-align:right;white-space:nowrap}
.rv b{display:block;font-size:14.5px;line-height:1.3}.rv small{display:block;font-size:10.2px;color:var(--mu);line-height:1.5}
.rv .okc{color:#2b8a3e}.rv .wrc{color:#b45309}
@media (max-width:600px){
.row{grid-template-columns:46px 1fr;padding:10px 11px}
.rv{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline;justify-content:flex-start;text-align:left;border-top:1px dashed var(--bd);padding-top:7px;white-space:normal}
.rv b{display:inline}.rv small{display:inline}
}
@media (min-width:768px){
#list{display:block}
.row{grid-template-columns:70px 1fr auto;gap:8px 20px;padding:14px 22px 14px 18px;margin-bottom:11px;border-radius:16px}
.row:hover{box-shadow:0 5px 16px rgba(20,35,55,.13)}
.rd{padding:9px 2px;border-radius:13px}.rd b{font-size:26px}.rd span{font-size:12px}
.rt{font-size:15.5px}.rt .ap{font-size:12px;padding:2px 11px}
.rs{font-size:13.5px;margin-top:4px}.rn{font-size:13px;margin-top:5px}
.rv{min-width:150px}.rv b{font-size:18px}.rv small{font-size:12.5px}
}
</style></head><body>
<div class="wrap">
  <div class="head"><div><h1>⚡ บันทึกการใช้เครื่องปั่นไฟ</h1><div class="today" id="today"></div><p class="sub" id="mode">กำลังโหลดข้อมูล…</p></div><button class="ibtn" id="bat" aria-label="เช็กแบตเตอรี่" title="เช็กแบตเตอรี่"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="17" height="10" rx="2.5"/><path d="M22 10.5v3"/><path d="M11.2 9 9 12.5h3L9.8 16"/></svg></button></div>
  <div class="seg" id="seg"><button data-v="use" class="on">📋 บันทึกการใช้งาน</button><button data-v="chk">🔧 ตรวจเช็กรายเดือน</button></div>
  <div class="tabs" id="tabs"></div>
  <div id="usev">
  <div class="bar" id="fbar"><select id="fmode"><option value="all">📅 ทุกวัน</option><option value="day">เฉพาะวัน</option><option value="mon">เฉพาะเดือน</option><option value="yr">เฉพาะปี</option></select><input type="date" id="fday" style="display:none"><input type="month" id="fmon" style="display:none"><select id="fyr" style="display:none"></select></div>
  <div class="sub" id="fcap" style="margin:-4px 2px 8px"></div>
  <div class="grid" id="stats"></div>
  <div class="hint" id="hint" style="display:none">⚠️ ชั่วโมงทำงานสะสมครบ 50–100 ชม. ให้เปลี่ยนถ่ายน้ำมันเครื่อง</div></div>
  <div id="chkv" style="display:none"><label style="margin-top:0">เดือนที่ตรวจ</label><input type="month" id="mon"><div class="chips" id="chips"></div></div>
  <div class="bar"><input id="q" type="search" placeholder="🔍 ค้นหา JB / สถานที่ / ทีม"><button class="btn" id="xl">📥 Excel</button></div>
  <div id="list"></div>
</div>
<button class="fab" id="add">＋ บันทึกการใช้งาน</button>

<div class="ov" id="ov"><div class="sheet" id="sheet">
  <h2 id="ft">บันทึกการใช้งาน</h2>
  <div class="r2">
    <div><label>พื้นที่</label><select id="f_area"></select></div>
    <div><label>วันที่ใช้</label><input type="date" id="f_date"></div>
  </div>
  <label class="chk" id="fillrow"><input type="checkbox" id="f_fill"> ⛽ เติมน้ำมันอย่างเดียว</label>
  <div class="r2">
      <div><label>เลข JB</label><input id="f_jb" placeholder="JB26-xxxxxxx"></div>
      <div><label>Location</label><input id="f_loc" placeholder="9802-53"></div>
    </div>
    <label>ชื่อสถานที่ / Node</label><input id="f_node" placeholder="เช่น ชุมสายออมทอง">
  <div id="run">
    <div class="r2">
      <div><label>เวลาเริ่ม</label><input type="time" id="f_s"></div>
      <div><label>เวลาสิ้นสุด</label><input type="time" id="f_e"></div>
    </div>
    <div class="calc" id="calc"></div>
  </div>
  <label>ทีม</label><input id="f_team" placeholder="เช่น RON-YLA007">
  <label>ประเภทน้ำมัน</label><select id="f_fuel"><option value="">เลือกประเภทน้ำมัน</option><option>แก๊สโซฮอล์ 95</option><option>แก๊สโซฮอล์ 91</option><option>ดีเซล</option><option>อื่นๆ</option></select>
  <div class="r2">
    <div><label>เติมกี่ลิตร</label><input type="number" inputmode="decimal" step="0.01" id="f_fl"></div>
    <div><label>จำนวนกี่บาท</label><input type="number" inputmode="decimal" step="0.01" id="f_amt"></div>
  </div>
  <div id="lvlrow" style="display:none"><label>🛢️ ปริมาณน้ำมันล่าสุด</label><div class="r2"><input type="number" inputmode="decimal" step="0.1" id="f_lv" placeholder="เช่น 85"><select id="f_lu"><option value="%">% (เปอร์เซ็นต์ถัง)</option><option value="ลิตร">ลิตร</option></select></div></div>
  <label>หมายเหตุ</label><textarea id="f_note" rows="5" placeholder="เช่น เหลือแกลลอน 20 ลิตร"></textarea>
  <div class="act"><button class="btn" id="cancel">ยกเลิก</button><button class="btn" id="del" style="display:none;color:#e03131">ลบ</button><button class="btn pri" id="save">บันทึก</button></div>
</div></div>

<div class="ov" id="ov3"><div class="sheet" id="sheet3">
  <h2 id="ct">แบบตรวจเช็กเครื่องปั่นไฟ</h2>
  <div class="r2"><div><label>พื้นที่</label><select id="c_area"></select></div><div><label>วันที่ตรวจ</label><input type="date" id="c_date"></div></div>
  <div class="r2"><div><label>ชื่อผู้ตรวจ</label><input id="c_insp"></div><div><label>ชั่วโมงสะสม</label><input type="number" inputmode="decimal" step="0.1" id="c_hours"></div></div>
  <label>ระดับน้ำมัน (%)</label><input type="number" inputmode="numeric" min="0" max="100" id="c_level" placeholder="เช่น 100">
  <label>รายการตรวจเช็ก</label><div id="ck_items"></div>
  <button class="btn" id="c_all" type="button" style="margin-top:10px;width:100%">✓ ปกติทั้งหมด</button>
  <label class="chk" style="margin-top:12px"><input type="checkbox" id="c_oil"> 🛢️ เปลี่ยนน้ำมันเครื่องแล้ว</label>

  const k=q.trim().toLowerCase();
  const list=rows.filter(r=>inF(r)&&(area==="ทั้งหมด"||r.area===area)&&(!k||[r.jb,r.loc,r.node,r.team,r.fuel,r.note].join(" ").toLowerCase().includes(k)))
    .sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.ts||0)-(a.ts||0));
  $("#fday").style.display=fmode==="day"?"":"none";$("#fmon").style.display=fmode==="mon"?"":"none";$("#fyr").style.display=fmode==="yr"?"":"none";

$("#b_close").onclick=()=>$("#ov4").classList.remove("on");
$("#ov4").onclick=e=>{if(e.target.id==="ov4")e.target.classList.remove("on")};
const SM=(list,fill,amt)=>{const L=list.find(r=>r.lvl!=null&&r.lvl!=="");return[["🔢",list.length+" ครั้ง","จำนวนครั้งที่บันทึก"],["🛢️",L?fmt(L.lvl,1)+" "+(L.lvlUnit||"%"):"-","ปริมาณน้ำมันล่าสุด"+(L?" ("+dstr(L.date)+")":"")],["⛽",fmt(fill,1)+" ลิตร","น้ำมันที่เติมรวม"],["💰",fmt(amt,0)+" บาท","จำนวนเงินรวม"]]};
const CAREAS=AREAS.filter(a=>a!=="ชุมสาย");
const ITEMS=["ทำความสะอาดภายนอก","ตรวจจุดยึดและน๊อต","เช็คระบบเชื้อเพลิง","ทดสอบรันเครื่อง 10-15 นาที","ทดสอบการจ่ายไฟ","วัดแรงดันไฟ 220 V","ตรวจกรองอากาศ","ตรวจน้ำมันเครื่อง","ตรวจหัวเทียน"];
const LS2="gen-checks-v1";
const ls2Load=()=>{try{return JSON.parse(localStorage.getItem(LS2)||"[]")}catch(e){return[]}};
const ls2Save=()=>{try{localStorage.setItem(LS2,JSON.stringify(chk))}catch(e){}};
const todayS=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const lastChk=a=>chk.filter(c=>c.area===a&&c.oil).reduce((m,c)=>(c.date||"")>m?c.date:m,"");
const hrs=a=>{const l=lastChk(a);return Math.round(rows.filter(r=>r.area===a&&(!l||(r.date||"")>l)).reduce((s,r)=>s+(r.minutes||0),0)/60*10)/10};
$("#ck_items").innerHTML=ITEMS.map((t,i)=>`<label class="chk"><input type="checkbox" data-i="${i}"> ${t}</label>`).join("");
$("#c_area").innerHTML=CAREAS.map(a=>`<option>${a}</option>`).join("");
$("#c_area").onchange=()=>{const a=$("#c_area").value;$("#sheet3").style.setProperty("--ac",COL[a]);if(!editCid)$("#c_hours").value=hrs(a)};
$("#c_all").onclick=()=>document.querySelectorAll("#ck_items input").forEach(x=>x.checked=true);
function oilInfo(){$("#c_info").textContent=$("#c_oil").checked?"♻️ เมื่อบันทึก ชั่วโมงสะสมของพื้นที่นี้จะเริ่มนับใหม่จาก 0":"ℹ️ ไม่ได้เปลี่ยนน้ำมันเครื่อง ชั่วโมงสะสมจะนับต่อไป"}
$("#c_oil").onchange=oilInfo;
$("#c_cancel").onclick=()=>$("#ov3").classList.remove("on");
$("#ov3").onclick=e=>{if(e.target.id==="ov3")e.target.classList.remove("on")};
$("#seg").onclick=e=>{const b=e.target.closest("button");if(b){view=b.dataset.v;render()}};
$("#mon").onchange=e=>{month=e.target.value||month;render()};
$("#chips").onclick=e=>{const b=e.target.closest(".chip");if(b)openChk(b.dataset.id||null,b.dataset.a)};
function renderChk(){
  $("#mon").value=month;
  const m=chk.filter(c=>c.month===month);
  $("#chips").innerHTML=CAREAS.map(a=>{const c=m.find(x=>x.area===a);return `<button class="chip ${c?"done":""}" data-a="${a}" data-id="${c?c.id:""}" style="--c:${COL[a]}"><b>${a}</b><span>${c?"✓ ตรวจแล้ว "+dstr(c.date):"ยังไม่ตรวจ · แตะเพื่อบันทึก"}<br>⏱️ สะสม ${fmt(hrs(a),1)} ชม.</span></button>`}).join("");
  const k=q.trim().toLowerCase();
  const list=m.filter(c=>(area==="ทั้งหมด"||c.area===area)&&(!k||[c.inspector,c.summary].join(" ").toLowerCase().includes(k))).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  $("#list").innerHTML=!ready?'<div class="empty">กำลังโหลด…</div>':list.length?list.map(chkRow).join(""):'<div class="empty">ยังไม่มีรายการตรวจเช็กในเดือนนี้<br>แตะชื่อพื้นที่ด้านบนหรือปุ่ม ＋ เพื่อบันทึก</div>';
}
function openChk(id,a){
  editCid=id;const r=chk.find(x=>x.id===id)||{};
  $("#ct").textContent=id?"แก้ไขการตรวจเช็ก":"แบบตรวจเช็กเครื่องปั่นไฟ";
  const ar=r.area||a||(area!=="ทั้งหมด"?area:CAREAS[0]);
  $("#c_area").value=ar;$("#sheet3").style.setProperty("--ac",COL[ar]);
  $("#c_date").value=r.date||(month===todayS().slice(0,7)?todayS():month+"-01");
  $("#c_insp").value=r.inspector||"";$("#c_hours").value=id?(r.hours??""):hrs(ar);$("#c_level").value=r.level??"";
  document.querySelectorAll("#ck_items input").forEach((x,i)=>x.checked=!!(r.ck||[])[i]);
  $("#c_oil").checked=!!r.oil;oilInfo();$("#c_sum").value=r.summary||"";$("#c_del").style.display=id?"block":"none";$("#ov3").classList.add("on");
}
$("#c_save").onclick=async()=>{
  const date=$("#c_date").value,insp=$("#c_insp").value.trim();
  if(!date)return toast("กรุณาเลือกวันที่ตรวจ");if(!insp)return toast("กรุณาใส่ชื่อผู้ตรวจ");
  const old=chk.find(x=>x.id===editCid)||{},h=$("#c_hours").value,l=$("#c_level").value;
  const rec={area:$("#c_area").value,date,month:date.slice(0,7),inspector:insp,hours:h===""?"":+h,level:l===""?"":+l,
    ck:[...document.querySelectorAll("#ck_items input")].map(x=>x.checked),summary:$("#c_sum").value.trim(),oil:$("#c_oil").checked,ts:old.ts||Date.now()};
  const id=editCid||uid();
  try{
    if(col2)await col2.doc(id).set(rec);
    else{const o={...rec,id},i=chk.findIndex(x=>x.id===id);i<0?chk.push(o):chk[i]=o;ls2Save()}
    month=rec.month;area=rec.area;$("#ov3").classList.remove("on");render();toast("บันทึกแล้ว ✓");
  }catch(err){toast("บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง")}
};
$("#c_del").onclick=async()=>{
  if(!confirm("ลบรายการตรวจเช็กนี้?"))return;
  try{if(col2)await col2.doc(editCid).delete();else{chk=chk.filter(x=>x.id!==editCid);ls2Save()}
    $("#ov3").classList.remove("on");render();toast("ลบแล้ว")}catch(e){toast("ลบไม่สำเร็จ")}
};
$("#xl").onclick=async()=>{
  if(!window.ExcelJS)return toast("ส่งออก Excel ไม่พร้อมใช้งาน");
  try{
  const FONT="Tahoma",WHITE="FFFFFFFF",INK="FF16212C",MUTE="FF52606D";
  const argb=c=>"FF"+c.replace("#","").toUpperCase();
  const tint=(c,t)=>{const h=c.replace("#","");return "FF"+[0,2,4].map(i=>{const v=parseInt(h.substr(i,2),16);return Math.round(v+(255-v)*t).toString(16).padStart(2,"0")}).join("").toUpperCase()};
  const thin={style:"thin",color:{argb:"FFC9D1DA"}},BD={top:thin,left:thin,bottom:thin,right:thin};
  const fillOf=a=>({type:"pattern",pattern:"solid",fgColor:{argb:a}});
  const MF=m=>{const[y,mm]=(m||"").split("-");return mm?`${MONF[+mm-1]} ${+y+543}`:""};
  const cap=fmode==="day"?dstr(fday):fmode==="mon"?(fmon?MF(fmon):"ทุกวัน"):fmode==="yr"?`ปี ${+fyr+543}`:"ข้อมูลทั้งหมด";
  const now=new Date(),stamp=`ออกรายงานเมื่อ ${dstr(todayS())} เวลา ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")} น.`;
  const wb=new ExcelJS.Workbook();wb.creator="Hareef";wb.created=now;

  const mkSheet=(name,color,n,title,sub)=>{
    const ws=wb.addWorksheet(name,{properties:{tabColor:{argb:argb(color)}},views:[{state:"frozen",ySplit:4,showGridLines:false}],
      pageSetup:{orientation:"landscape",paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:0,printTitlesRow:"4:4",margins:{left:.4,right:.4,top:.5,bottom:.5,header:.3,footer:.3}}});
    ws.mergeCells(1,1,1,n);const t=ws.getCell(1,1);t.value=title;t.font={name:FONT,bold:true,size:16,color:{argb:WHITE}};t.fill=fillOf(argb(color));t.alignment={horizontal:"left",vertical:"middle",indent:1};ws.getRow(1).height=36;
    ws.mergeCells(2,1,2,n);const s=ws.getCell(2,1);s.value=sub;s.font={name:FONT,size:10,color:{argb:MUTE}};s.fill=fillOf(tint(color,.88));s.alignment={horizontal:"left",vertical:"middle",indent:1};ws.getRow(2).height=22;
    ws.getRow(3).height=8;
    return ws};
  const head=(ws,labels,color)=>{const r=ws.getRow(4);labels.forEach((t,i)=>{const c=r.getCell(i+1);c.value=t;c.font={name:FONT,bold:true,size:11,color:{argb:WHITE}};c.fill=fillOf(argb(color));c.alignment={horizontal:"center",vertical:"middle",wrapText:true};c.border=BD});r.height=38};
  const body=(c,{h="left",wrap=false,fmtN,bold=false,fill,color=INK}={})=>{c.font={name:FONT,size:10.5,bold,color:{argb:color}};c.alignment={horizontal:h,vertical:"middle",wrapText:wrap};c.border=BD;if(fmtN)c.numFmt=fmtN;if(fill)c.fill=fillOf(fill)};
  const empty=(ws,n,r,color)=>{ws.mergeCells(r,1,r,n);const c=ws.getCell(r,1);c.value="ไม่พบข้อมูลในช่วงที่เลือก";c.font={name:FONT,size:11,color:{argb:MUTE}};c.alignment={horizontal:"center",vertical:"middle"};c.border=BD;ws.getRow(r).height=30};

  const areas=area==="ทั้งหมด"?AREAS:[area];
  const getL=a=>rows.filter(r=>r.area===a&&inF(r)).sort((x,y)=>(x.date||"").localeCompare(y.date||"")||(x.ts||0)-(y.ts||0));

  /* ---------- หน้าสรุปภาพรวม ---------- */
  if(area==="ทั้งหมด"){
    const color=COL["ทั้งหมด"],H=["พื้นที่","จำนวนครั้งที่ใช้งาน","เวลาเดินเครื่อง (ชม.)","น้ำมันที่ใช้ (ลิตร)","เติมน้ำมัน (ลิตร)","จำนวนเงิน (บาท)","ชั่วโมงสะสมหลังเปลี่ยนน้ำมันเครื่อง (ชม.)"];
    const ws=mkSheet("สรุปภาพรวม",color,H.length,"⚡ สรุปการใช้เครื่องปั่นไฟ",`ช่วงข้อมูล: ${cap}   |   ${stamp}`);
    head(ws,H,color);ws.getRow(4).height=48;
    [18,16,18,18,16,16,26].forEach((w,i)=>ws.getColumn(i+1).width=w);
    const T={n:0,m:0,u:0,f:0,a:0};
    areas.forEach((a,i)=>{
      const l=getL(a),n=l.filter(r=>!r.fillOnly).length,m=l.reduce((s,r)=>s+(r.minutes||0),0)/60,u=l.reduce((s,r)=>s+usedOf(r),0),f=l.reduce((s,r)=>s+(+r.filled||0),0),am=l.reduce((s,r)=>s+(+r.amount||0),0);
      T.n+=n;T.m+=m;T.u+=u;T.f+=f;T.a+=am;
      const r=ws.getRow(5+i),zb=i%2?tint(COL[a],.93):null;r.height=26;
      const vals=[a,n,+m.toFixed(2),+u.toFixed(2),+f.toFixed(2),+am.toFixed(2),a==="ชุมสาย"?"-":hrs(a)];
      const fm=[null,"#,##0","#,##0.0","#,##0.00","#,##0.00","#,##0.00","#,##0.0"];
      vals.forEach((v,j)=>{const c=r.getCell(j+1);c.value=v;
        if(j===0)body(c,{bold:true,color:argb(COL[a]),fill:tint(COL[a],.85)});else body(c,{h:j===6&&v==="-"?"center":"right",fmtN:fm[j],fill:zb});
        if(j===0)c.border={...BD,left:{style:"thick",color:{argb:argb(COL[a])}}};
        if(j===6&&typeof v==="number"&&v>=50){c.font={name:FONT,size:10.5,bold:true,color:{argb:"FFC92A2A"}};c.fill=fillOf("FFFFE3E3")}});
    });
    const tr=ws.getRow(5+areas.length);tr.height=28;
    [["รวมทั้งหมด",null],[T.n,"#,##0"],[+T.m.toFixed(2),"#,##0.0"],[+T.u.toFixed(2),"#,##0.00"],[+T.f.toFixed(2),"#,##0.00"],[+T.a.toFixed(2),"#,##0.00"],["",null]].forEach(([v,f],j)=>{const c=tr.getCell(j+1);c.value=v;body(c,{h:j?"right":"left",bold:true,fmtN:f,fill:tint(color,.8)});c.border={...BD,top:{style:"medium",color:{argb:argb(color)}}}});
    ws.getRow(7+areas.length).getCell(1).value="หมายเหตุ: ชั่วโมงสะสมที่ครบ 50 ชม. จะแสดงเป็นสีแดง ควรเปลี่ยนถ่ายน้ำมันเครื่อง";
    ws.getRow(7+areas.length).getCell(1).font={name:FONT,size:9.5,italic:true,color:{argb:MUTE}};
  }

  /* ---------- ชีตรายพื้นที่ ---------- */
  const H=["ลำดับ","วันที่ใช้","เลข JB","Location","ชื่อสถานที่ / Node","ทีม","เริ่ม","สิ้นสุด","ใช้เวลา (นาที)","น้ำมันที่ใช้ (ลิตร)","ประเภทน้ำมัน","เติมกี่ลิตร","จำนวนกี่บาท","หมายเหตุ","ปริมาณน้ำมันล่าสุด"];
  const W=[7,15,15,11,28,15,8,8,12,14,16,11,13,30,18],N=H.length;
  areas.forEach(a=>{
    const color=COL[a],l=getL(a);
    const ws=mkSheet(a,color,N,`⚡ บันทึกการใช้เครื่องปั่นไฟ – ${a}`,`ช่วงข้อมูล: ${cap}   |   ทั้งหมด ${l.length} รายการ   |   ${stamp}`);
    head(ws,H,color);W.forEach((w,i)=>ws.getColumn(i+1).width=w);
    if(!l.length){empty(ws,N,5,color);return}
    l.forEach((r,i)=>{
      const row=ws.getRow(5+i),zb=i%2?tint(color,.93):null;row.height=24;
      const fo=r.fillOnly&&!r.node;
      const v=[i+1,dstr(r.date),r.jb||"",r.loc||"",fo?"เติมน้ำมันอย่างเดียว":(r.node||""),r.team||"",r.start||"",r.end||"",r.minutes||0,+usedOf(r).toFixed(2),r.fuel||"",r.filled||0,r.amount||0,r.note||"",r.lvl!=null&&r.lvl!==""?r.lvl+" "+(r.lvlUnit||"%"):""];
      const al=["center","center","center","center","left","center","center","center","right","right","center","right","right","left","center"];
      const fm=[null,null,null,null,null,null,null,null,"#,##0","#,##0.00",null,"#,##0.00","#,##0.00",null,null];
      v.forEach((x,j)=>{const c=row.getCell(j+1);c.value=x;body(c,{h:al[j],fmtN:fm[j],wrap:j===4||j===13,fill:zb,bold:j===0,color:j===0?argb(color):INK})});
      if(fo){row.getCell(5).font={name:FONT,size:10.5,italic:true,color:{argb:argb(color)}}}
    });
    const last=4+l.length,tr=ws.getRow(last+1);tr.height=28;
    ws.mergeCells(last+1,1,last+1,8);
    const tl=tr.getCell(1);tl.value=`รวม ${l.length} รายการ`;
    const sum=(col,key)=>({formula:`SUM(${col}5:${col}${last})`,result:l.reduce((s,r)=>s+key(r),0)});
    const tot=[[9,"I",r=>r.minutes||0,"#,##0"],[10,"J",r=>+usedOf(r).toFixed(2),"#,##0.00"],[12,"L",r=>+r.filled||0,"#,##0.00"],[13,"M",r=>+r.amount||0,"#,##0.00"]];
    for(let j=1;j<=N;j++){const c=tr.getCell(j);body(c,{h:"right",bold:true,fill:tint(color,.8)});c.border={...BD,top:{style:"medium",color:{argb:argb(color)}}}}
    tl.value=`รวม ${l.length} รายการ`;
    tot.forEach(([j,L,k,f])=>{const c=tr.getCell(j);c.value=sum(L,k);c.numFmt=f});
    ws.autoFilter={from:{row:4,column:1},to:{row:last,column:N}};
  });

  /* ---------- ชีตตรวจเช็กรายเดือน ---------- */
  {
    const color=COL["ทั้งหมด"],cs=chk.slice().sort((x,y)=>(x.date||"").localeCompare(y.date||"")||AREAS.indexOf(x.area)-AREAS.indexOf(y.area));
    const H2=["เดือน","วันที่ตรวจ","ผู้ตรวจ","พื้นที่","ชั่วโมงสะสม","ระดับน้ำมัน (%)",...ITEMS,"เปลี่ยนน้ำมันเครื่อง","สรุปผลดำเนินการ"],N2=H2.length;
    const ws=mkSheet("ตรวจเช็กรายเดือน",color,N2,"🔧 แบบตรวจเช็กเครื่องปั่นไฟรายเดือน",`ทั้งหมด ${cs.length} รายการ   |   ✓ = ผ่าน   ✗ = ยังไม่ผ่าน   |   ${stamp}`);
    head(ws,H2,color);ws.getRow(4).height=52;
    [14,15,16,12,12,13,...ITEMS.map(()=>15),15,34].forEach((w,i)=>ws.getColumn(i+1).width=w);
    if(!cs.length)empty(ws,N2,5,color);
    cs.forEach((c,i)=>{
      const row=ws.getRow(5+i),zb=i%2?"FFF3F6F9":null,ac=COL[c.area]||color;row.height=26;
      const v=[MF(c.month),dstr(c.date),c.inspector||"",c.area,c.hours===""||c.hours==null?"":+c.hours,c.level===""||c.level==null?"":+c.level,...ITEMS.map((t,j)=>(c.ck||[])[j]?"✓":"✗"),c.oil?"✓":"",c.summary||""];
      v.forEach((x,j)=>{const cell=row.getCell(j+1);cell.value=x;
        if(j===3)body(cell,{h:"center",bold:true,color:argb(ac),fill:tint(ac,.85)});
        else if(j>=6&&j<6+ITEMS.length)body(cell,{h:"center",bold:true,color:x==="✓"?"FF2B8A3E":"FFC92A2A",fill:x==="✓"?"FFD3F9D8":"FFFFE3E3"});
        else if(j===6+ITEMS.length)body(cell,{h:"center",bold:true,color:"FFB45309",fill:x?"FFFFF3BF":zb});
        else body(cell,{h:j===2||j===H2.length-1?"left":"center",wrap:j===H2.length-1,fmtN:j===4?"#,##0.0":j===5?"#,##0":null,fill:zb})});
    });
    if(cs.length)ws.autoFilter={from:{row:4,column:1},to:{row:4+cs.length,column:N2}};
  }

  const buf=await wb.xlsx.writeBuffer(),a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
  a.download=`รายงานเครื่องปั่นไฟ-${area}.xlsx`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast("ส่งออกไฟล์แล้ว ✓");
  }catch(e){console.error(e);toast("ส่งออกไม่สำเร็จ")}
};
render();
</script></body></html>
