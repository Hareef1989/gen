<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>บันทึกการใช้เครื่องปั่นไฟ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f1f4f8;--card:#fff;--tx:#16212c;--mu:#52606d;--bd:#e0e5eb;--ac:#0b7285;--on:#fff;--sf:#eaf0f5;--sh:0 1.5px 7px rgba(20,35,55,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151a;--card:#1a2129;--tx:#eef2f6;--mu:#a5b0bc;--bd:#2b343e;--sf:#232c35;--sh:none}}
:root[data-theme="dark"]{--bg:#10151a;--card:#1a2129;--tx:#eef2f6;--mu:#a5b0bc;--bd:#2b343e;--sf:#232c35;--sh:none}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:11.9px/1.5 system-ui,"Noto Sans Thai","Sarabun",sans-serif}
.wrap{max-width:532px;margin:0 auto;padding:9.8px 9.8px 77px}
.head{display:flex;justify-content:space-between;align-items:center;gap:7px;margin-bottom:8.4px}
h1{font-size:15.4px;margin:0;line-height:1.25}.sub{color:var(--mu);font-size:9.8px;margin:1.5px 0 0}
.gear{flex:none;width:33.6px;height:33.6px;border-radius:9.8px;border:1px solid var(--bd);background:var(--card);font-size:15.4px;box-shadow:var(--sh)}
.tabs{display:flex;gap:5.6px;overflow-x:auto;padding:1.5px 1.5px 7px;scrollbar-width:none}
.tab{flex:none;display:flex;align-items:center;gap:5.6px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:699.3px;padding:6.3px 11.2px;font:inherit;font-size:11.2px;font-weight:600;box-shadow:var(--sh)}
.tab i{width:8.4px;height:8.4px;border-radius:50%;background:var(--c)}
.tab.on{background:var(--c);border-color:var(--c);color:#fff}.tab.on i{background:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:2.8px 0 8.4px}
.stat{background:var(--card);border-radius:11.2px;padding:9.1px 9.8px;box-shadow:var(--sh);border:1px solid var(--bd)}
.stat b{display:block;font-size:16.8px;line-height:1.2}.stat span{color:var(--mu);font-size:9.8px}
.stat em{font-style:normal;font-size:14px;display:block;margin-bottom:1.5px}
.hint{background:var(--sf);border-left:3.5px solid var(--ac);border-radius:8.4px;padding:7px 9.8px;font-size:10.5px;margin-bottom:8.4px}
.bar{display:flex;gap:7px;margin-bottom:8.4px}
input,select{width:100%;font:inherit;font-size:11.9px;color:var(--tx);background:var(--card);border:1.5px solid var(--bd);border-radius:9.8px;padding:8.4px 9.8px;min-height:35px}
input:focus,select:focus{outline:none;border-color:var(--ac)}
.btn{border:1.5px solid var(--bd);border-radius:9.8px;padding:8.4px 11.2px;font:inherit;font-weight:600;background:var(--card);color:var(--tx);min-height:35px;white-space:nowrap}
.card{background:var(--card);border-radius:11.2px;border-left:4.9px solid var(--c);padding:9.1px 10.5px;margin-bottom:7px;box-shadow:var(--sh);border-top:1px solid var(--bd);border-right:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.card .t{display:flex;justify-content:space-between;align-items:flex-start;gap:7px}
.ttl{font-size:12.6px;font-weight:700;line-height:1.3}.lc{margin-right:4.2px}
.dt{color:var(--mu);font-size:10.5px;white-space:nowrap}
.card .m{font-size:11.2px;margin-top:3.5px}.card .s{color:var(--mu);font-size:10.5px;margin-top:2.8px}
.tag{display:inline-block;font-size:9.8px;font-weight:700;border-radius:5.6px;padding:1.5px 7px;background:var(--c);color:#fff;margin-bottom:4.2px}
.empty{text-align:center;color:var(--mu);padding:25.2px 5.6px;font-size:12.6px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(11.2px + env(safe-area-inset-bottom,0px));background:var(--ac);color:var(--on);border:0;border-radius:699.3px;padding:11.2px 22.4px;font:inherit;font-weight:700;font-size:13.3px;box-shadow:0 5.6px 15.4px rgba(0,0,0,.28);white-space:nowrap}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
.ov.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:532px;max-height:94%;overflow:auto;border-radius:16.8px 16.8px 0 0;border-top:5.6px solid var(--ac);padding:11.2px 11.2px calc(14px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 4.2px;font-size:14.7px}
label{display:block;font-size:10.5px;font-weight:600;margin:8.4px 0 3.5px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.calc{background:var(--sf);border-radius:9.8px;padding:8.4px 9.8px;margin-top:8.4px;font-size:11.2px;font-weight:600}
.chk{display:flex;gap:8.4px;align-items:center;margin:8.4px 0 1.5px;font-size:11.9px;font-weight:600;background:var(--card);border:1.5px solid var(--bd);border-radius:9.8px;padding:8.4px 9.8px}
.chk input{width:16.8px;height:16.8px;min-height:0;accent-color:var(--ac)}
.act{display:flex;gap:7px;margin-top:12.6px}.act .btn{flex:1}.pri{background:var(--ac);color:var(--on);border-color:var(--ac);flex:2!important;font-size:12.6px}
.toast{position:fixed;top:calc(9.8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#1d2b36;color:#fff;border-radius:8.4px;padding:7.7px 14px;font-size:11.2px;z-index:9;display:none}
.seg{display:flex;gap:5.6px;margin-bottom:8.4px}
.seg button{flex:1;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:9.8px;padding:7.7px 5.6px;font:inherit;font-size:11.2px;font-weight:700;box-shadow:var(--sh)}
.seg button.on{background:var(--ac);border-color:var(--ac);color:var(--on)}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:8.4px 0}
.chip{text-align:left;border:1.5px solid var(--c);border-left-width:4.9px;background:var(--card);color:var(--tx);border-radius:9.8px;padding:7px 8.4px;font:inherit}
.chip b{display:block;font-size:11.9px}.chip span{font-size:9.8px;color:var(--mu)}
.chip.done{background:var(--c)}.chip.done b,.chip.done span{color:#fff}
.bad{color:#e03131;font-weight:600}
#ck_items .chk{margin:4.2px 0 0}
.today{font-size:13px;font-weight:600;color:var(--ac);margin-top:2px}#fbar>*{flex:1}#fbar #fmode{flex:0 0 38%}
.ibtn{flex:none;width:38px;height:38px;display:grid;place-items:center;border:0;border-radius:12px;background:var(--ac);color:var(--on);box-shadow:var(--sh);padding:0}.ibtn:active{transform:scale(.95)}
</style></head><body>
<div class="wrap">
  <div class="head"><div><h1>⚡ บันทึกการใช้เครื่องปั่นไฟ</h1><div class="today" id="today"></div><p class="sub" id="mode">กำลังโหลดข้อมูล…</p></div><button class="ibtn" id="bat" aria-label="เช็กแบตเตอรี่" title="เช็กแบตเตอรี่"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="17" height="10" rx="2.5"/><path d="M22 10.5v3"/><path d="M11.2 9 9 12.5h3L9.8 16"/></svg></button></div>
  <div class="seg" id="seg"><button data-v="use" class="on">📋 บันทึกการใช้งาน</button><button data-v="chk">🔧 ตรวจเช็กรายเดือน</button></div>
  <div class="tabs" id="tabs"></div>
  <div id="usev">
  <div class="bar" id="fbar"><select id="fmode"><option value="all">📅 ทุกวัน</option><option value="day">เฉพาะวัน</option><option value="mon">เฉพาะเดือน</option><option value="yr">เฉพาะปี</option></select><input type="date" id="fday" style="display:none"><input type="month" id="fmon" style="display:none"><select id="fyr" style="display:none"></select></div>
  <div class="sub" id="fcap" style="margin:-4px 2px 8px"></div>
  <div class="grid" id="stats"></div>
  <div class="hint" id="hint" style="display:none">⚠️ ชั่วโมงทำงานสะสมครบ 50–100 ชม. ให้เปลี่ยนถ่ายน้ำมันเครื่อง</div></div>
  <div id="chkv" style="display:none"><label style="margin-top:0">เดือนที่ตรวจ</label><input type="month" id="mon"><div class="chips" id="chips"></div></div>
  <div class="bar"><input id="q" type="search" placeholder="🔍 ค้นหา JB / สถานที่ / ทีม"><button class="btn" id="xl">📥 Excel</button></div>
  <div id="list"></div>
</div>
<button class="fab" id="add">＋ บันทึกการใช้งาน</button>

<div class="ov" id="ov"><div class="sheet" id="sheet">
  <h2 id="ft">บันทึกการใช้งาน</h2>
  <div class="r2">
    <div><label>พื้นที่</label><select id="f_area"></select></div>
    <div><label>วันที่ใช้</label><input type="date" id="f_date"></div>
  </div>
  <label class="chk" id="fillrow"><input type="checkbox" id="f_fill"> ⛽ เติมน้ำมันอย่างเดียว</label>
  <div class="r2">
      <div><label>เลข JB</label><input id="f_jb" placeholder="JB26-xxxxxxx"></div>
      <div><label>Location</label><input id="f_loc" placeholder="9802-53"></div>
    </div>
    <label>ชื่อสถานที่ / Node</label><input id="f_node" placeholder="เช่น ชุมสายออมทอง">
  <div id="run">
    <div class="r2">
      <div><label>เวลาเริ่ม</label><input type="time" id="f_s"></div>
      <div><label>เวลาสิ้นสุด</label><input type="time" id="f_e"></div>
    </div>
    <div class="calc" id="calc"></div>
  </div>
  <label>ทีม</label><input id="f_team" placeholder="เช่น RON-YLA007">
  <label>ประเภทน้ำมัน</label><select id="f_fuel"><option value="">เลือกประเภทน้ำมัน</option><option>แก๊สโซฮอล์ 95</option><option>แก๊สโซฮอล์ 91</option><option>ดีเซล</option><option>อื่นๆ</option></select>
  <div class="r2">
    <div><label>เติมกี่ลิตร</label><input type="number" inputmode="decimal" step="0.01" id="f_fl"></div>
    <div><label>จำนวนกี่บาท</label><input type="number" inputmode="decimal" step="0.01" id="f_amt"></div>
  </div>
  <div id="lvlrow" style="display:none"><label>🛢️ ปริมาณน้ำมันล่าสุด</label><div class="r2"><input type="number" inputmode="decimal" step="0.1" id="f_lv" placeholder="เช่น 85"><select id="f_lu"><option value="%">% (เปอร์เซ็นต์ถัง)</option><option value="ลิตร">ลิตร</option></select></div></div>
  <label>หมายเหตุ</label><input id="f_note" placeholder="เช่น เหลือแกลลอน 20 ลิตร">
  <div class="act"><button class="btn" id="cancel">ยกเลิก</button><button class="btn" id="del" style="display:none;color:#e03131">ลบ</button><button class="btn pri" id="save">บันทึก</button></div>
</div></div>

<div class="ov" id="ov3"><div class="sheet" id="sheet3">
  <h2 id="ct">แบบตรวจเช็กเครื่องปั่นไฟ</h2>
  <div class="r2"><div><label>พื้นที่</label><select id="c_area"></select></div><div><label>วันที่ตรวจ</label><input type="date" id="c_date"></div></div>
  <div class="r2"><div><label>ชื่อผู้ตรวจ</label><input id="c_insp"></div><div><label>ชั่วโมงสะสม</label><input type="number" inputmode="decimal" step="0.1" id="c_hours"></div></div>
  <label>ระดับน้ำมัน (%)</label><input type="number" inputmode="numeric" min="0" max="100" id="c_level" placeholder="เช่น 100">
  <label>รายการตรวจเช็ก</label><div id="ck_items"></div>
  <button class="btn" id="c_all" type="button" style="margin-top:10px;width:100%">✓ ปกติทั้งหมด</button>
  <label class="chk" style="margin-top:12px"><input type="checkbox" id="c_oil"> 🛢️ เปลี่ยนน้ำมันเครื่องแล้ว</label>
  <label>สรุปผลดำเนินการ</label><input id="c_sum" placeholder="เช่น ทุกอย่างปกติ / เปลี่ยนน้ำมันเครื่อง">
  <div class="calc" id="c_info"></div>
  <div class="act"><button class="btn" id="c_cancel">ยกเลิก</button><button class="btn" id="c_del" style="display:none;color:#e03131">ลบ</button><button class="btn pri" id="c_save">บันทึก</button></div>
</div></div>
<div class="ov" id="ov4"><div class="sheet">
  <h2>🔋 แบตเตอรี่ลิเธียม อยู่ได้อีกกี่ชั่วโมง</h2>
  <div class="r2">
    <div><label>ความจุรวม (Ah)</label><input type="number" inputmode="decimal" step="0.1" id="b_ah"></div>
    <div><label>กระแสโหลด (A)</label><input type="number" inputmode="decimal" step="0.01" id="b_a" placeholder="เช่น 1.93"></div>
  </div>
  <label>ความจุคงเหลือ (%)</label><input type="number" inputmode="decimal" step="1" min="0" max="100" id="b_p" placeholder="เช่น 61">
  <div class="calc" id="b_res" style="line-height:1.7"></div>
  <div class="act"><button class="btn pri" id="b_close">ปิด</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const AREAS=["ปัตตานี","ยะลา","นราธิวาส","เบตง","ชุมสาย"];
const COL={"ทั้งหมด":"#0b7285","ปัตตานี":"#2b8a3e","ยะลา":"#1971c2","นราธิวาส":"#862e9c","เบตง":"#d9480f","ชุมสาย":"#c2255c"};
const MON=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
let RATE=1.45,rows=[],chk=[],view="use",month=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,7),area="ทั้งหมด",q="",editId=null,editCid=null,col=null,col2=null,ready=false;
const $=s=>document.querySelector(s);
const fmt=(n,d=1)=>Number(n||0).toLocaleString("th-TH",{maximumFractionDigits:d});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mins=(s,e)=>{if(!s||!e)return 0;const[a,b]=s.split(":").map(Number),[c,d]=e.split(":").map(Number);let m=c*60+d-a*60-b;return m<0?m+1440:m};
const hm=m=>m>=60?Math.floor(m/60)+" ชม. "+(m%60)+" นาที":m+" นาที";
const dstr=s=>{const[y,m,d]=(s||"").split("-");return d?`${+d} ${MON[m-1]} ${+y+543}`:""};
const usedOf=r=>r.used!=null?r.used:(r.minutes||0)/60*RATE;
const toast=t=>{const e=$("#toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2200)};
const LS="gen-usage-v1";
const lsLoad=()=>{try{return JSON.parse(localStorage.getItem(LS)||"[]")}catch(e){return[]}};
const lsSave=()=>{try{localStorage.setItem(LS,JSON.stringify(rows))}catch(e){}};

const SB="https://pxnpfihzbjaanhthhhwy.supabase.co/rest/v1",KEY="sb_publishable_Xwic0txHbgO3WHZoTWFm_g_Vojo0NU7";
const HD={apikey:KEY,"Content-Type":"application/json"};
const uid=()=>crypto.randomUUID?crypto.randomUUID():"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==="x"?r:r&3|8).toString(16)});
const num=v=>v===""||v==null?null:+v;
const U={t:"gen_usage",
  to:r=>({area:r.area,use_date:r.date,fill_only:!!r.fillOnly,jb:r.jb||"",loc:r.loc||"",node:r.node||"",start_t:r.start||"",end_t:r.end||"",minutes:r.minutes||0,rate:r.rate||1.45,used:r.used||0,team:r.team||"",fuel:r.fuel||"",filled:r.filled||0,amount:r.amount||0,note:r.note||"",lvl:r.lvl??null,lvl_unit:r.lvlUnit||"%",created_at:new Date(r.ts||Date.now()).toISOString()}),
  from:r=>({id:r.id,area:r.area,date:r.use_date,fillOnly:r.fill_only,jb:r.jb,loc:r.loc,node:r.node,start:r.start_t,end:r.end_t,minutes:r.minutes,rate:+r.rate,used:+r.used,team:r.team,fuel:r.fuel,filled:+r.filled,amount:+r.amount,note:r.note,lvl:r.lvl==null?null:+r.lvl,lvlUnit:r.lvl_unit,ts:Date.parse(r.created_at)})};
const C={t:"gen_checks",
  to:r=>({area:r.area,check_date:r.date,month:r.month,inspector:r.inspector||"",hours:num(r.hours),level:num(r.level),ck:r.ck||[],oil:!!r.oil,summary:r.summary||"",created_at:new Date(r.ts||Date.now()).toISOString()}),
  from:r=>({id:r.id,area:r.area,date:r.check_date,month:r.month,inspector:r.inspector,hours:r.hours==null?"":+r.hours,level:r.level==null?"":+r.level,ck:r.ck||[],oil:r.oil,summary:r.summary,ts:Date.parse(r.created_at)})};
async function sb(path,opt){const r=await fetch(SB+"/"+path,{...opt,headers:{...HD,...(opt&&opt.headers)}});if(!r.ok)throw new Error("HTTP "+r.status);return r}
async function loadAll(m){const out=[];for(let o=0;;o+=1000){const j=await(await sb(`${m.t}?select=*&order=created_at.asc&limit=1000&offset=${o}`)).json();out.push(...j);if(j.length<1000)break}return out.map(m.from)}
function mkCol(m){return{doc:id=>({
  async set(rec){await sb(m.t+"?on_conflict=id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({id,...m.to(rec)})});await refreshAll()},
  async delete(){await sb(`${m.t}?id=eq.${encodeURIComponent(id)}`,{method:"DELETE"});await refreshAll()}})}}
col=mkCol(U);col2=mkCol(C);
let busy=false;
async function refreshAll(){
  if(busy)return;busy=true;
  try{const[a,b]=await Promise.all([loadAll(U),loadAll(C)]);rows=a;chk=b;ready=true;$("#mode").textContent="ข้อมูลแชร์ร่วมกันทุกคน (Supabase) | by Hareef";render()}
  catch(e){$("#mode").textContent="⚠️ เชื่อมต่อฐานข้อมูลไม่ได้ กำลังลองใหม่…"}
  finally{busy=false}
}
refreshAll();setInterval(()=>{if(!document.hidden)refreshAll()},10000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshAll()});

function render(){
  if(view==="chk"&&area==="ชุมสาย")area="ทั้งหมด";
  document.documentElement.style.setProperty("--ac",COL[area]);
  $("#tabs").innerHTML=["ทั้งหมด",...(view==="chk"?CAREAS:AREAS)].map(a=>`<button class="tab ${a===area?"on":""}" data-a="${a}" style="--c:${COL[a]}"><i></i>${a}</button>`).join("");
  document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  $("#usev").style.display=view==="use"?"block":"none";$("#chkv").style.display=view==="chk"?"block":"none";
  $("#add").textContent=view==="use"?"＋ บันทึกการใช้งาน":"＋ บันทึกการตรวจเช็ก";
  view==="use"?renderUse():renderChk();
}
function renderUse(){
  const k=q.trim().toLowerCase();
  const list=rows.filter(r=>inF(r)&&(area==="ทั้งหมด"||r.area===area)&&(!k||[r.jb,r.loc,r.node,r.team,r.fuel,r.note].join(" ").toLowerCase().includes(k)))
    .sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.ts||0)-(a.ts||0));

  w2["!cols"]=[9,12,14,10,12,14,...ITEMS.map(()=>16),14,30].map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,w2,"ตรวจเช็กรายเดือน");
  try{XLSX.writeFile(wb,`รายงานเครื่องปั่นไฟ-${area}.xlsx`)}catch(e){toast("ส่งออกไม่สำเร็จ")}
};
render();
</script></body></html>
